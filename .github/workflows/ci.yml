name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# NOTE: there is deliberately NO deploy workflow here.
# deploy/install.sh overwrites the LIVE ~/.hermes/config.yaml and profile
# SOUL/config files. This repo's snapshot has drifted from the running fleet,
# so auto-deploying it would revert the fleet's model configuration.
# See docs/DEPLOY.md before wiring any automated deploy.
jobs:
  check:
    name: Config and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate YAML config
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for f in list(pathlib.Path('deploy').rglob('*.yaml')) + list(pathlib.Path('deploy').rglob('*.yml')):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("Invalid YAML:", *bad, sep="\n  "); sys.exit(1)
          print("all deploy YAML parses")
          PY

      - name: Compile-check Python
        run: python -m compileall -q . -x '\.venv|node_modules'

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck -S error
